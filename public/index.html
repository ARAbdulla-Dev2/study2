<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">
  <div class="container my-5">
      <div class="table-responsive">
        <table class="table table-hover table-dark rounded">
          <thead class="thead-light">
            <tr>
              <th>Subject</th>
              <th>Total Lessons</th>
              <th>Studied Lessons</th>
              <th>Rank</th>
              <th>Progress</th>
              <th>Update</th>
            </tr>
          </thead>
          <tbody id="subjects-table">
            <!-- Populated dynamically -->
          </tbody>
        </table>
    </div>
    <div id="celebration" class="text-center d-none mt-5 position-fixed top-50 start-50 translate-middle p-4 bg-success text-white rounded shadow-lg">
      <h2 class="fw-bold">🎉 Leveled Up! 🎉</h2>
      <p>Keep up the amazing work!</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/script.js"></script>
</body>
</html>
